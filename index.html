<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عروض وخصومات مصر - أحسن الأسعار كل يوم</title>
  <meta name="description" content="أحدث العروض والخصومات من أشهر المتاجر في مصر، متحدثة كل يوم.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🔥 عروض وخصومات مصر</h1>
    <p>أحدث العروض من أشهر المتاجر، متحدثة باستمرار</p>
  </header>

  <section class="controls">
    <input type="text" id="search" placeholder="ابحث عن منتج أو متجر...">
    <select id="category">
      <option value="all">كل الأقسام</option>
      <option value="electronics">إلكترونيات</option>
      <option value="fashion">أزياء</option>
      <option value="home">المنزل</option>
      <option value="grocery">سوبر ماركت</option>
    </select>
  </section>

  <main id="offers" class="grid"></main>

  <footer>
    <p>تنبيه: بعض الروابط في الموقع روابط تسويق بالعمولة، يعني ممكن نحصل على عمولة صغيرة لو اشتريت من خلالها، بدون أي تكلفة إضافية عليك.</p>
    <p>© 2026 عروض وخصومات مصر</p>
  </footer>

  <script src="offers.js"></script>
</body>
</html>
